# Domínio oficial do sistema — noprumo.ia.br
# Instalação:
#   sudo cp deploy/nginx-noprumo.ia.br.conf /etc/nginx/sites-available/noprumo.ia.br
#   sudo ln -s /etc/nginx/sites-available/noprumo.ia.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Com o DNS (A/AAAA de noprumo.ia.br e www) já apontando para este servidor:
#   sudo certbot --nginx -d noprumo.ia.br -d www.noprumo.ia.br
# (o Certbot reescreve este arquivo adicionando o bloco SSL/redirect 301)
# Depois, ajustar APP_URL=https://noprumo.ia.br no .env e reiniciar o serviço.

server {
    listen 80;
    server_name noprumo.ia.br www.noprumo.ia.br;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
