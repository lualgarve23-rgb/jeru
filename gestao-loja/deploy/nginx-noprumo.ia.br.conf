# Domínio oficial do sistema — noprumo.ia.br
# Instalação:
#   sudo cp deploy/nginx-noprumo.ia.br.conf /etc/nginx/sites-available/noprumo.ia.br
#   sudo ln -s /etc/nginx/sites-available/noprumo.ia.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Com o DNS (A/AAAA de noprumo.ia.br e www) já apontando para este servidor:
#   sudo certbot --nginx -d noprumo.ia.br -d www.noprumo.ia.br
# (o Certbot reescreve este arquivo adicionando o bloco SSL/redirect 301)
# Depois, ajustar APP_URL=https://noprumo.ia.br e AUTH_URL=https://noprumo.ia.br
# no .env, gerar AUTH_SECRET forte (openssl rand -base64 32) e reiniciar o serviço.
#
# Checklist produção (#5):
#   [ ] HTTPS via Certbot (redirect 80 → 443)
#   [ ] AUTH_SECRET >= 32 bytes aleatórios
#   [ ] AUTH_URL / APP_URL com https://
#   [ ] NODE_ENV=production (cookies Secure do Auth.js)
#   [ ] CRON_SECRET e PIX_WEBHOOK_SECRET preenchidos

server {
    listen 80;
    server_name noprumo.ia.br www.noprumo.ia.br;

    client_max_body_size 20m;

    # Após o Certbot, preferir estes headers no server 443:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #   add_header X-Frame-Options "DENY" always;
    #   add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
